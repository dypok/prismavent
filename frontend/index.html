  <body>
    <div id="app" class="relative z-10"></div>

    <!-- ===== PRISMAS FLOTANTES ===== -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
      <svg class="absolute w-6 h-6 text-[#C9A84C]/10 top-[10%] left-[5%] animate-prism-float" style="animation-delay:0s;animation-duration:25s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-4 h-4 text-[#376847]/10 top-[20%] right-[15%] animate-prism-float" style="animation-delay:3s;animation-duration:20s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-8 h-8 text-[#755B00]/10 top-[40%] left-[10%] animate-prism-float" style="animation-delay:6s;animation-duration:30s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-5 h-5 text-[#C9A84C]/10 top-[60%] right-[8%] animate-prism-float" style="animation-delay:2s;animation-duration:22s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-7 h-7 text-[#376847]/10 top-[75%] left-[20%] animate-prism-float" style="animation-delay:8s;animation-duration:28s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>

      <svg class="absolute w-4 h-4 text-[#376847]/10 top-[50%] left-[5%] animate-prism-float" style="animation-delay:5s;animation-duration:15s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-6 h-6 text-[#755B00]/10 top-[30%] right-[5%] animate-prism-float" style="animation-delay:7s;animation-duration:26s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
