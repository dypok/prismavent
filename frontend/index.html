<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Prismavent — La plataforma todo-en-uno para planificar y gestionar eventos. Organiza bodas, conferencias y celebraciones con invitados, presupuesto, proveedores y tareas en un solo lugar." />
    <meta name="keywords" content="eventos, planificación de eventos, organización de bodas, gestión de eventos, proveedores, presupuesto" />
    <meta name="author" content="Prismavent Team" />
    <meta property="og:title" content="Prismavent — Planifica eventos inolvidables" />
    <meta property="og:description" content="La plataforma todo-en-uno para organizar bodas, conferencias y celebraciones. Gestiona invitados, presupuestos, proveedores y tareas en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prismavent.vercel.app" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prismavent — Planifica eventos inolvidables" />
    <meta name="twitter:description" content="La plataforma todo-en-uno para organizar bodas, conferencias y celebraciones." />
    <meta name="twitter:image" content="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Prismavent — Planifica eventos inolvidables</title>
  </head>
  <body class="bg-[#FFF8F1]">
    <div id="loading-cover" class="fixed inset-0 z-50 flex items-center justify-center bg-[#FFF8F1]">
      <div class="flex flex-col items-center gap-4">
        <img src="/logo.png" alt="Prismavent" class="h-12 w-auto">
        <div class="w-6 h-6 border-2 border-[#755B00] border-t-transparent rounded-full animate-spin"></div>
      </div>
    </div>

    <div id="app" class="relative"></div>

    <!-- ===== PRISMAS FLOTANTES (se muestran via JS tras cargar) ===== -->
    <div id="prism-bg" class="fixed inset-0 z-20 pointer-events-none overflow-hidden" style="display:none">
      <svg class="absolute w-8 h-8 text-[#C9A84C]/25 top-[15%] left-[8%] animate-prism-float" style="animation-delay:0s;animation-duration:22s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-5 h-5 text-[#376847]/25 top-[25%] right-[12%] animate-prism-float" style="animation-delay:3s;animation-duration:18s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-12 h-12 text-[#755B00]/25 top-[45%] left-[5%] animate-prism-float" style="animation-delay:6s;animation-duration:28s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-6 h-6 text-[#C9A84C]/25 top-[65%] right-[6%] animate-prism-float" style="animation-delay:2s;animation-duration:20s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-9 h-9 text-[#376847]/25 top-[80%] left-[15%] animate-prism-float" style="animation-delay:8s;animation-duration:26s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-4 h-4 text-[#755B00]/25 top-[10%] right-[35%] animate-prism-float" style="animation-delay:4s;animation-duration:16s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-7 h-7 text-[#C9A84C]/25 top-[55%] left-[30%] animate-prism-float" style="animation-delay:10s;animation-duration:30s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-5 h-5 text-[#376847]/25 top-[35%] right-[25%] animate-prism-float" style="animation-delay:5s;animation-duration:24s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-10 h-10 text-[#755B00]/25 top-[75%] right-[20%] animate-prism-float" style="animation-delay:7s;animation-duration:32s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
      <svg class="absolute w-6 h-6 text-[#C9A84C]/25 top-[20%] left-[25%] animate-prism-float" style="animation-delay:9s;animation-duration:14s" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 22,22 2,22"/></svg>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
